site_name: The Farmer Was Replaced — Lab
site_description: Unofficial study lab for The Farmer Was Replaced — mechanics, guides, tutorials and an annotated code collection.
site_url: https://lucascerattors.github.io/the-farmer-was-replaced-lab/
repo_url: https://github.com/LucasCerattoRS/the-farmer-was-replaced-lab
repo_name: LucasCerattoRS/the-farmer-was-replaced-lab

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle:
        icon: material/weather-sunny
        name: Light mode

validation:
  links:
    not_found: warn
    anchors: warn

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt
          name: Português (Brasil)
          build: true
          site_description: Laboratório de estudo não-oficial de The Farmer Was Replaced — mecânicas, guias, tutoriais e uma coleção de código anotada.
          nav_translations:
            Home: Início
            Getting Started: Primeiros Passos
            Mechanics: Mecânicas
            Crops & Economy: Culturas & Economia
            Drones & Multi-Drone: Drones & Multi-Drone
            Polyculture: Policultura
            Cactus Sorting: Ordenação de Cactos
            Mazes & Gold: Labirintos & Ouro
            Dinosaurs & Bones: Dinossauros & Ossos
            Leaderboards: Leaderboards
            Simulation: Simulação
            Language Quirks & Gotchas: Peculiaridades da Linguagem
            Guides: Guias
            Progression (early → end): Progressão (início → fim)
            Leaderboard Strategies: Estratégias de Leaderboard
            Tutorials: Tutoriais
            Overview: Visão geral
            "01 · Multi-Drone Farming": "01 · Farming Multi-Drone"
            "02 · Cactus Sorting": "02 · Ordenação de Cactos"
            "03 · Maze Gold Farming": "03 · Ouro em Labirintos"
            "04 · Dinosaur Apple Solver": "04 · Solver da Maçã do Dinossauro"
            "05 · Polyculture Optimization": "05 · Otimização de Policultura"
            "06 · Seed Hunting": "06 · Caça a Seeds"
            API Reference: Referência da API

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Mechanics:
      - Crops & Economy: mechanics/crops.md
      - Drones & Multi-Drone: mechanics/drones.md
      - Polyculture: mechanics/polyculture.md
      - Cactus Sorting: mechanics/cactus-sorting.md
      - Mazes & Gold: mechanics/mazes.md
      - Dinosaurs & Bones: mechanics/dinosaurs.md
      - Leaderboards: mechanics/leaderboards.md
      - Simulation: mechanics/simulation.md
      - Language Quirks & Gotchas: mechanics/language-quirks.md
  - Guides:
      - Progression (early → end): guides/progression.md
      - Leaderboard Strategies: guides/leaderboard-strategies.md
  - Tutorials:
      - Overview: tutorials/index.md
      - "01 · Multi-Drone Farming": tutorials/01-multi-drone.md
      - "02 · Cactus Sorting": tutorials/02-cactus-sorting.md
      - "03 · Maze Gold Farming": tutorials/03-maze-gold.md
      - "04 · Dinosaur Apple Solver": tutorials/04-dinosaur-apple.md
      - "05 · Polyculture Optimization": tutorials/05-polyculture.md
      - "06 · Seed Hunting": tutorials/06-seed-hunting.md
  - API Reference: api/reference.md
